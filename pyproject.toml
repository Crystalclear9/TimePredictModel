[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sglang-timepredict"
version = "0.1.0"
description = "Observed tool-return distributions for SGLang scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "xgboost>=2.1,<4", "redis>=5,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
timepredict = "timepredict.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timepredict"]
