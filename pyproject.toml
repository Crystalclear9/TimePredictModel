# 使用 hatchling 构建 wheel；运行时依赖与可选实验依赖分别声明。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 包名与 Python 导入名 timepredict 不同；要求 Python 3.11 及以上。
name = "sglang-timepredict"
version = "0.1.0"
description = "Observed tool-return distributions for SGLang scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "xgboost>=2.1,<4", "redis>=5,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "sentence-transformers>=3,<6"]

[project.optional-dependencies]
# 公开数据读取和绘图依赖；pytest 未包含在此列表，需要验证环境另行提供。
experiments = ["datasets>=3,<5", "pyarrow>=15,<22", "matplotlib>=3.8,<4"]

[project.scripts]
# 安装后提供 timepredict 命令，分派到 cli.main。
timepredict = "timepredict.cli:main"

[tool.hatch.build.targets.wheel]
# src 布局：仅将 timepredict Python 包打入 wheel。
packages = ["src/timepredict"]
