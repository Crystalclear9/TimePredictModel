# 使用 hatchling 构建 wheel；测试和语义编码依赖按需安装。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 包名与 Python 导入名 timepredict 不同；要求 Python 3.11 及以上。
name = "sglang-timepredict"
version = "0.1.0"
description = "Observed tool-return distributions for SGLang scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "xgboost>=2.1,<4", "redis>=5,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "fakeredis[lua]>=2.26,<3"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
# 安装后提供 timepredict 命令，分派到 cli.main。
timepredict = "timepredict.cli:main"

[tool.hatch.build.targets.wheel]
# src 布局：仅将 timepredict Python 包打入 wheel。
packages = ["src/timepredict"]
